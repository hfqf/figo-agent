  <div class="app"><aside><h1>工作区操作</h1><div class="subtitle">切换工作区、浏览与编辑文件、执行本地终端命令。</div><div class="version">当前版本：v1.0.0</div><nav id="diagramNav"></nav><div class="legend"><div class="legend-title">图例</div><div class="legend-row"><span class="swatch" style="background:#eef6ff"></span>入口/页面</div><div class="legend-row"><span class="swatch" style="background:#fff7db"></span>判断/分支</div><div class="legend-row"><span class="swatch" style="background:#f0ecff"></span>服务/数据</div><div class="legend-row"><span class="swatch" style="background:#ffe8e8"></span>异常出口</div><div class="legend-row"><span class="swatch" style="background:#e8fff3"></span>引用子流程</div></div></aside><main><div class="toolbar"><div class="diagram-title"><strong id="activeTitle"></strong><span id="activeMeta"></span></div><div class="actions"><button type="button" id="zoomOut">缩小</button><button type="button" id="zoomIn">放大</button><button type="button" id="resetView">回到起点</button><button type="button" id="toggleSource">打开源图</button><a class="button" href="./workspace.md">打开 MD</a><a class="button" href="../index.html">返回总入口</a></div></div><div class="canvas-wrap" id="canvasWrap"><div class="canvas" id="canvas"><div class="diagram-card"><div class="mermaid" id="diagram"></div></div></div></div></main></div>

<script type="application/vnd.mermaid" data-id="01_overview" data-title="工作区操作总览" data-path="diagrams/01-overview.mmd">
%% flow-version: v1.0.0
%% updated-at: 2026-10-13
%% source: code/src/ui/local-api.ts; code/src/ui/workspace-files.ts; code/src/ui/terminal-service.ts
flowchart TD
  A[&quot;工作台打开工作区&quot;] --&gt; B{&quot;用户操作&quot;}
  B --&gt;|浏览和编辑| R2[&quot;引用子流程 02&lt;br/&gt;文件预览、保存、引用&lt;br/&gt;点击查看&quot;]
  B --&gt;|执行命令| R3[&quot;引用子流程 03&lt;br/&gt;终端执行与停止&lt;br/&gt;点击查看&quot;]
  B --&gt;|切换目录| C[&quot;POST /api/v1/workspaces/open&lt;br/&gt;启动新 Kernel&quot;]
  C --&gt;|活动 Run 或终端未结束| X[&quot;HTTP 409&lt;br/&gt;拒绝切换工作区&quot;]
  C --&gt;|成功| D[&quot;关闭旧服务上下文&lt;br/&gt;更新最近目录与 bootstrap&quot;]
  click R2 call openDiagram_02_files() &quot;查看文件流程&quot;
  click R3 call openDiagram_03_terminal() &quot;查看终端流程&quot;
  class A page;
  class B decision;
  class C,D service;
  class X error;
  class R2,R3 ref;
  classDef page fill:#eef6ff,stroke:#2f80ed,color:#102a43;
  classDef decision fill:#fff7db,stroke:#b7791f,color:#3b2f0b;
  classDef service fill:#f0ecff,stroke:#6b46c1,color:#2d1b69;
  classDef error fill:#ffe8e8,stroke:#d93025,color:#7a1c14;
  classDef ref fill:#e8fff3,stroke:#159957,color:#0b5132,stroke-width:2px;
</script>
<script type="application/vnd.mermaid" data-id="02_files" data-title="文件查看、编辑与引用" data-path="diagrams/02-files.mmd">
%% flow-version: v1.0.0
%% updated-at: 2026-10-13
%% source: code/src/ui/workspace-files.ts; code/src/ui/local-api.ts; code/web/src/FilePreviewPane.tsx
flowchart TD
  A[&quot;文件树或搜索&lt;br/&gt;GET /api/v1/files 或 /files/search&quot;] --&gt; B[&quot;WorkspaceFileService&lt;br/&gt;限定工作区根目录&quot;]
  B --&gt; C[&quot;点击文件&lt;br/&gt;GET /api/v1/file?path&quot;]
  C --&gt; D{&quot;文本且未超过预览上限?&quot;}
  D --&gt;|否| X1[&quot;拒绝二进制或标记 tooLarge&lt;br/&gt;不进入编辑&quot;]
  D --&gt;|是| E[&quot;返回 content + SHA-256 version&lt;br/&gt;在文件窗口直接编辑&quot;]
  E --&gt; F[&quot;显式保存&lt;br/&gt;PUT /api/v1/file path/content/version&quot;]
  F --&gt; G{&quot;路径安全且 version 未变化?&quot;}
  G --&gt;|否| X2[&quot;路径拒绝或 HTTP 409&lt;br/&gt;提示刷新预览&quot;]
  G --&gt;|是| H[&quot;临时文件写入、同步并 rename&lt;br/&gt;file.saved 事件&quot;]
  E --&gt; I[&quot;向 Turn 引用行区间&lt;br/&gt;startLine/endLine/version&quot;]
  I --&gt; J[&quot;validateReference 复核文件版本&lt;br/&gt;有效内容进入 ContextPack&quot;]
  class A,E page;
  class D,G decision;
  class B,C,F,H,I,J service;
  class X1,X2 error;
  classDef page fill:#eef6ff,stroke:#2f80ed,color:#102a43;
  classDef decision fill:#fff7db,stroke:#b7791f,color:#3b2f0b;
  classDef service fill:#f0ecff,stroke:#6b46c1,color:#2d1b69;
  classDef error fill:#ffe8e8,stroke:#d93025,color:#7a1c14;
</script>
<script type="application/vnd.mermaid" data-id="03_terminal" data-title="终端执行与停止" data-path="diagrams/03-terminal.mmd">
%% flow-version: v1.0.0
%% updated-at: 2026-10-13
%% source: code/src/ui/terminal-service.ts; code/src/ui/local-api.ts
flowchart TD
  A[&quot;工作台终端输入命令&lt;br/&gt;POST /api/v1/terminal&quot;] --&gt; B{&quot;命令有效且无运行中的命令?&quot;}
  B --&gt;|否| X1[&quot;拒绝空命令、超长命令或并发命令&quot;]
  B --&gt;|是| C[&quot;TerminalService.execute&lt;br/&gt;terminal.started 事件&quot;]
  C --&gt; D{&quot;是否 cd 命令?&quot;}
  D --&gt;|是| E[&quot;解析并验证目标目录&lt;br/&gt;更新终端 cwd&quot;]
  D --&gt;|否| F[&quot;spawn SHELL -lc&lt;br/&gt;cwd = 当前终端目录&quot;]
  F --&gt; G{&quot;退出、超时或用户停止?&quot;}
  G --&gt;|正常退出| H[&quot;completed 或 failed&lt;br/&gt;记录 exitCode&quot;]
  G --&gt;|停止或超时| I[&quot;SIGTERM 进程组&lt;br/&gt;status = stopped&quot;]
  E --&gt;|目录无效| X2[&quot;status = failed&lt;br/&gt;输出目录错误&quot;]
  E --&gt;|成功| H
  H --&gt; J[&quot;terminal.* 事件&lt;br/&gt;页面刷新输出&quot;]
  I --&gt; J
  class A page;
  class B,D,G decision;
  class C,E,F,H,I,J service;
  class X1,X2 error;
  classDef page fill:#eef6ff,stroke:#2f80ed,color:#102a43;
  classDef decision fill:#fff7db,stroke:#b7791f,color:#3b2f0b;
  classDef service fill:#f0ecff,stroke:#6b46c1,color:#2d1b69;
  classDef error fill:#ffe8e8,stroke:#d93025,color:#7a1c14;
</script>
